name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to stage
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn
        run: corepack prepare yarn@3.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify workflow dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release-tag must start with v" >&2; exit 1 ;;
          esac

      - name: Verify tag commit is on main
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: |
          git fetch origin main --no-tags
          RELEASE_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Build package
        run: yarn build

      - name: Test package
        run: yarn test

      - name: Pack package
        id: pack
        run: |
          PACKAGE_FILE="$(npm pack --ignore-scripts)"
          echo "package-file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.package-file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Use npm 11.19.1 or later
        run: npm install --global npm@11.19.1 --ignore-scripts

      - name: Extract package
        run: |
          mkdir -p staged-package
          tar -xzf package/*.tgz --strip-components=1 -C staged-package

      - name: Verify staged package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: test "v$(node -p "require('./staged-package/package.json').version")" = "$RELEASE_TAG"

      - name: Stage package
        working-directory: staged-package
        run: npm stage publish
